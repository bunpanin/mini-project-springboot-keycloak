server:
  port: 8081

spring:
  application:
    name: task-manager
  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
#    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskdb}
#    username: ${SPRING_DATASOURCE_USERNAME:user}
#    password: ${SPRING_DATASOURCE_PASSWORD:password}
#    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/task-manager-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/task-manager-realm/protocol/openid-connect/certs}

keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:task-manager-client}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
